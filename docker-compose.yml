services:
  postgres:
    image: postgres:16-alpine
    container_name: khyra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khyra
      POSTGRES_PASSWORD: khyra_secret
      POSTGRES_DB: khyra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khyra -d khyra_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: khyra_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_logs:/app/src/.logs
      - ./src/client_config.json:/app/src/client_config.json:ro

volumes:
  pgdata:
    driver: local
  app_logs:
    driver: local
